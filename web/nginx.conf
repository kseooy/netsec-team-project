# D 담당: nginx 웹서버 보안 설정
# (docker-compose에서 /etc/nginx/conf.d/default.conf 로 마운트됨)

server {
    listen 80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 1. 버전 정보 숨김 ------------------------------------------------
    #    응답 헤더 "Server: nginx/1.xx.x" → "Server: nginx"
    #    기본 에러 페이지 하단의 버전 표시도 함께 사라짐
    server_tokens off;

    # 2. 보안 응답 헤더 --------------------------------------------------
    #    (always: 404 같은 에러 응답에도 헤더를 붙임)
    add_header X-Frame-Options        "DENY"            always;  # 다른 사이트에 iframe으로 끼워넣기 금지 (클릭재킹 방지)
    add_header X-Content-Type-Options "nosniff"         always;  # 브라우저가 파일 형식을 멋대로 추측하지 않게
    add_header Referrer-Policy        "no-referrer"     always;  # 다른 사이트로 이동할 때 주소 정보 안 넘김
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;  # 우리 서버 리소스만 로드 허용

    # 3. 디렉터리 목록 노출 금지 ----------------------------------------
    autoindex off;

    # 4. 요청 크기·시간 제한 (대용량 요청 / 느린 연결 공격 완화) ----------
    client_max_body_size  1k;
    client_body_timeout   10s;
    client_header_timeout 10s;
    keepalive_timeout     15s;
    send_timeout          10s;

    # 5. 숨김 파일(.git, .env, .htaccess 등) 접근 차단 -------------------
    location ~ /\. {
        deny all;
    }

    # 6. 정적 페이지만 서비스 — GET/HEAD 외 메서드(POST, PUT, DELETE...) 차단
    location / {
        limit_except GET {     # GET을 허용하면 HEAD도 자동 허용
            deny all;
        }
        try_files $uri $uri/ =404;
    }

    # 7. 에러 페이지를 직접 만든 페이지로 교체 (nginx 기본 페이지 노출 X)
    error_page 400 403 404 405 /error.html;
    error_page 500 502 503 504 /error.html;
    location = /error.html {
        internal;              # 주소창에 /error.html 직접 입력해서는 못 봄
    }
}
